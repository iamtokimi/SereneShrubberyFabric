# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G

# Skip Mercury source-remap of mod dependencies — fixes Windows file-lock
# collisions with VS Code Java LSP during Loom cache setup. See
# feedback_gradle_build.md for full explanation.
systemProp.fabric.loom.ci=true
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.caching.debug=false

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Mod Properties
mod.id=serene_shrubbery
mod.name=Serene Shrubbery
mod.version=1.2.1
mod.group=net.sereneshrubbery
mod.description=Beautiful decorative flowers for your Minecraft world
